name: Deploy Redirect to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Create redirect page
      run: |
        mkdir -p _site
        cat > _site/index.html << 'EOF'
        <!DOCTYPE html>
        <html lang="en">
        <head>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=https://sbujordi.github.io/StrainCascade/">
          <script>window.location.replace("https://sbujordi.github.io/StrainCascade/")</script>
          <title>Redirecting...</title>
        </head>
        <body>
          <p>Redirecting to <a href="https://sbujordi.github.io/StrainCascade/">https://sbujordi.github.io/StrainCascade/</a></p>
        </body>
        </html>
        EOF
        cp _site/index.html _site/404.html
        touch _site/.nojekyll

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./_site
        publish_branch: gh-pages
